<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ニュースと記事をひとつにまとめる、シンプルなニュースリーダー" />
    <title>ニュース | ニュースハブ</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#" aria-label="ニュースハブ トップ"><span class="brand-mark">N</span><strong>ニュース</strong></a>
      <nav class="topnav" aria-label="メインナビゲーション">
        <a class="topnav-link active" href="#home">ホーム</a>
        <a class="topnav-link" href="#saved">保存済み</a>
      </nav>
      <div class="top-actions">
        <label class="global-search"><span>⌕</span><input id="search-input" type="search" placeholder="検索" /></label>
        <button class="avatar" aria-label="プロフィール">U</button>
      </div>
    </header>

    <main class="page" id="home">
      <section class="intro">
        <div>
          <p class="date-label" id="date-label">最新情報を取得しています</p>
          <h1>今日のニュース。</h1>
          <p class="intro-copy">気になる記事を、すっきり見つける。</p>
        </div>
        <button class="refresh-button" id="refresh-button"><span>↻</span> 更新</button>
      </section>

      <section class="quick-filters" aria-label="記事の絞り込み">
        <button class="filter-chip active" data-filter="all">すべて</button>
        <button class="filter-chip" data-filter="technology"><span class="chip-dot blue"></span>テクノロジー</button>
        <button class="filter-chip" data-filter="business"><span class="chip-dot orange"></span>ビジネス</button>
        <button class="filter-chip" data-filter="science"><span class="chip-dot green"></span>サイエンス</button>
        <button class="filter-chip" data-filter="saved">保存済み</button>
      </section>

      <section class="content-layout">
        <div class="feed">
          <div class="feed-heading">
            <div><h2>最新の記事</h2><span id="result-count">4件</span></div>
            <button class="sort-button" id="sort-button">新着順 <span>⌄</span></button>
          </div>
          <div id="article-list" class="article-list"></div>
          <button id="load-more" class="load-more">さらに表示</button>
        </div>

        <aside class="side-content">
          <section class="side-card highlight-card">
            <p class="side-label">今日のトピック</p>
            <h2>生成AIの現在地</h2>
            <p>いま知っておきたい、AIの最新ニュースをまとめました。</p>
            <button class="topic-button" data-topic="technology">記事を見る <span>→</span></button>
          </section>
          <section class="side-card">
            <div class="side-heading"><h2>よく読まれている</h2><span>今日</span></div>
            <div class="popular-item"><b>01</b><span>企業が注目する生成AIの最新トレンド</span></div>
            <div class="popular-item"><b>02</b><span>気候変動を止めるためにできること</span></div>
            <div class="popular-item"><b>03</b><span>民間企業が切り拓く宇宙ビジネス</span></div>
          </section>
        </aside>
      </section>
    </main>

    <nav class="mobile-nav" aria-label="モバイルナビゲーション">
      <a class="active" href="#home"><span>⌂</span>ホーム</a>
      <a href="#saved"><span>☆</span>保存済み</a>
      <a href="#topics"><span>◉</span>トピック</a>
    </nav>
    <dialog class="article-dialog" id="article-dialog">
      <button class="dialog-close" id="dialog-close" aria-label="閉じる">×</button>
      <p class="dialog-category" id="dialog-category"></p>
      <h2 id="dialog-title"></h2>
      <p class="dialog-meta" id="dialog-meta"></p>
      <p class="dialog-description" id="dialog-description"></p>
      <div class="dialog-actions">
        <a class="dialog-read" id="dialog-read" href="#" target="_blank" rel="noopener noreferrer">情報源を開く <span>↗</span></a>
        <button class="dialog-save" id="dialog-save">☆ 保存する</button>
      </div>
    </dialog>
    <script src="app.js"></script>
  </body>
</html>
